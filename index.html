<script>
  // Синхронно проверяем наличие сессии до рендера, чтобы не было мигания экрана входа
  try {
    if (localStorage.getItem('sb-rdotiwxihcolalrjihtb-auth-token')) {
      document.documentElement.classList.add('authed');
    }
    if (!navigator.onLine) document.documentElement.classList.add('offline');
  } catch(e) {}
  // Регистрация service worker (нужен для запуска PWA без сети)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW register failed:', e));
    });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Linear-inspired tokens */
  :root {
    --bg: #08090c;
    --surface: #101114;
    --surface-2: #16181d;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.12);
    --text: #ededee;
    --text-strong: #fafafa;
    --muted: #8a8a93;
    --muted-2: #5b5d66;
    --danger: #f43f5e;
    --accent: #5e6ad2;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "ss01", "cv11";
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; }
  input, select { font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px; outline: none; width: 100%; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

  /* Layout */
  .app {
    max-width: 680px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) 14px calc(72px + env(safe-area-inset-bottom));
  }
  header, .header-actions, .icon-btn { display: none !important; }

  /* Bottom navigation — icons only */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex;
    background: rgba(15,17,20,0.92);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--border-strong);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1; display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 4px; border-radius: 10px;
    color: var(--muted-2);
    transition: color .15s, background .15s;
  }
  .tab svg { width: 24px; height: 24px; stroke-width: 1.8; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text-strong); }
  .tab.active svg { stroke-width: 2.2; }

  /* ===== Active timer card — compact horizontal ===== */
  .now {
    position: relative;
    background: linear-gradient(180deg, var(--surface) 0%, #0f1117 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 22px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color .3s ease, box-shadow .3s ease;
    min-height: 110px;
  }
  .now::before {
    content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at left center, var(--c, transparent) 0%, transparent 60%);
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  .now-head { position: relative; display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .now-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none;
    transition: background .25s, box-shadow .25s;
  }
  .now-name {
    font-weight: 600; font-size: 20px; letter-spacing: -0.025em;
    min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now-time {
    position: relative;
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 400;
    font-size: clamp(56px, 14vw, 84px);
    letter-spacing: -0.06em;
    line-height: 1;
    color: var(--text);
    text-align: center;
  }
  .now-sub, .now-meta { display: none; }

  .now.idle { display: none; }

  /* RUNNING */
  .now.running {
    border-color: color-mix(in srgb, var(--c) 50%, var(--border) 50%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent),
                0 12px 32px -16px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .now.running::before { opacity: 0.22; }
  .now.running .now-dot {
    background: var(--c);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent),
                0 0 10px color-mix(in srgb, var(--c) 80%, transparent);
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  .now.running .now-time {
    color: #fff;
    text-shadow: 0 0 24px color-mix(in srgb, var(--c) 60%, transparent);
  }
  @keyframes pulse-dot { 0%,100% { transform: scale(1); } 50% { transform: scale(0.6); opacity: 0.85; } }

  .now { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .now:active { transform: scale(0.99); }

  /* WARN */
  .now.warn {
    border-color: #ef4444;
    box-shadow: 0 0 0 1px rgba(239,68,68,0.5), 0 12px 32px -16px rgba(239,68,68,0.55);
    animation: warn-pulse 2s ease-in-out infinite;
  }
  .now.warn::before {
    background: radial-gradient(ellipse at left center, #ef4444 0%, transparent 60%);
    opacity: 0.28;
  }
  .now.warn .now-dot {
    background: #ef4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.25), 0 0 12px rgba(239,68,68,0.7);
  }
  @keyframes warn-pulse {
    0%,100% { box-shadow: 0 0 0 1px rgba(239,68,68,0.5), 0 12px 32px -16px rgba(239,68,68,0.55); }
    50%     { box-shadow: 0 0 0 3px rgba(239,68,68,0.3), 0 16px 40px -12px rgba(239,68,68,0.75); }
  }

  /* Categories — 2-col grid, name only, big bold */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 14px 18px 22px;
    display: flex; align-items: center;
    text-align: left;
    color: var(--text);
    transition: background .15s, border-color .15s, transform .08s;
    overflow: hidden;
    min-height: 78px;
  }
  .cat::before {
    content: ''; position: absolute;
    left: 8px; top: 16px; bottom: 16px;
    width: 3px; border-radius: 2px;
    background: var(--c);
    transition: box-shadow .25s, top .25s, bottom .25s;
  }
  .cat:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .cat:active { transform: scale(0.99); }
  .cat-name {
    font-size: 20px; font-weight: 600; letter-spacing: -0.025em; color: var(--text-strong);
    line-height: 1.1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    flex: 1;
  }
  .cat.active {
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, var(--surface)) 0%, var(--surface) 75%);
    border-color: color-mix(in srgb, var(--c) 50%, var(--border-strong));
  }
  .cat.active::before {
    top: 10px; bottom: 10px;
    box-shadow: 0 0 14px var(--c), 0 0 4px var(--c);
  }
  .cat.active .cat-name { color: #fff; }

  /* Section title */
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted-2); margin: 22px 2px 10px; }

  /* Stats */
  .stats { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .range-switch {
    display: flex; gap: 2px; background: var(--surface-2);
    padding: 3px; border-radius: 8px; margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .range-switch button {
    flex: 1; padding: 7px; border-radius: 6px; font-size: 12.5px; color: var(--muted);
    font-weight: 500; letter-spacing: -0.005em; transition: background .15s, color .15s;
  }
  .range-switch button:hover { color: var(--text); }
  .range-switch button.active { background: var(--bg); color: var(--text-strong); box-shadow: 0 1px 0 rgba(255,255,255,0.04); }
  /* Range picker (custom calendar) */
  .range-picker { position: relative; margin-bottom: 14px; }
  .range-field {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; font-size: 13px; text-align: left;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; color: var(--text); letter-spacing: -0.005em;
    transition: border-color .15s, color .15s;
  }
  .range-field:hover { border-color: var(--muted-2); color: var(--text-strong); }
  .range-field.open { border-color: var(--muted); color: var(--text-strong); }
  .range-field svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .cal {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .cal.hidden { display: none; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 13px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
  .cal-nav {
    width: 28px; height: 28px; border-radius: 7px; color: var(--muted);
    font-size: 17px; line-height: 1; transition: background .15s, color .15s;
  }
  .cal-nav:hover { background: var(--surface-2); color: var(--text-strong); }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow { margin-bottom: 4px; }
  .cal-dow span {
    text-align: center; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted-2); padding: 4px 0;
  }
  .cal-grid { row-gap: 2px; }
  .cal-day {
    position: relative; height: 32px; font-size: 12.5px; color: var(--text);
    font-variant-numeric: tabular-nums; border-radius: 7px;
    transition: background .12s, color .12s;
  }
  .cal-day.out { color: var(--muted-2); }
  .cal-day:hover { background: var(--surface-2); color: var(--text-strong); }
  .cal-day.in-range { background: var(--surface-2); border-radius: 0; }
  .cal-day.edge { background: var(--accent); color: #fff; border-radius: 7px; font-weight: 600; }
  .cal-day.edge:hover { background: var(--accent); color: #fff; }
  .cal-day.today::after {
    content: ''; position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: currentColor;
  }
  .cal-hint { margin-top: 10px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .stats-total-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .stats-total-row .stats-total { margin: 0; }
  .stats-range-label { color: var(--muted); font-size: 12px; letter-spacing: -0.01em; text-align: right; }
  .stats-total {
    font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 16px;
    font-variant-numeric: tabular-nums; color: var(--text-strong);
  }
  .stats-row { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; }
  .stats-row .dot { width: 8px; height: 8px; border-radius: 50%; }
  .stats-row .name { font-size: 13.5px; color: var(--text); letter-spacing: -0.005em; }
  .stats-row .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); letter-spacing: -0.01em; }
  .stats-bar {
    grid-column: 1 / -1; height: 4px; background: var(--surface-2);
    border-radius: 2px; overflow: hidden; margin: 0 0 6px;
  }
  .stats-bar > div { height: 100%; border-radius: 2px; }
  .stats-empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 13px; }

  /* Timeline — 06:00 → 24:00, top of screen, no card chrome */
  .timeline-card { padding: 0; margin: 0 0 18px; background: transparent; border: 0; }
  .timeline-head, .timeline-legend { display: none; }

  /* Daylight strip — реальное солнце SPB */
  .timeline-daylight {
    position: relative;
    height: 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--surface-2);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.07),
      0 1px 3px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .timeline-daylight::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(0,0,0,0.18) 100%);
    pointer-events: none;
  }
  .timeline-track {
    position: relative;
    height: 52px;
    border-radius: 14px;
    background:
      /* Quarter-day grid (более заметные) */
      linear-gradient(90deg,
        transparent 0, transparent calc(25% - 0.5px),
        rgba(255,255,255,0.10) calc(25% - 0.5px), rgba(255,255,255,0.10) calc(25% + 0.5px),
        transparent calc(25% + 0.5px), transparent calc(50% - 0.5px),
        rgba(255,255,255,0.14) calc(50% - 0.5px), rgba(255,255,255,0.14) calc(50% + 0.5px),
        transparent calc(50% + 0.5px), transparent calc(75% - 0.5px),
        rgba(255,255,255,0.10) calc(75% - 0.5px), rgba(255,255,255,0.10) calc(75% + 0.5px),
        transparent calc(75% + 0.5px)),
      /* Vertical depth gradient — светлее, чем фон */
      linear-gradient(180deg, #22252d 0%, #181a21 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -1px 0 rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.10),
      0 2px 8px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .timeline-seg {
    position: absolute; top: 0; bottom: 0;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--c) 88%, white 12%) 0%,
        var(--c) 45%,
        color-mix(in srgb, var(--c) 82%, black 18%) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.18),
      0 0 14px color-mix(in srgb, var(--c) 35%, transparent);
    transition: filter .15s ease, transform .15s ease;
  }
  .timeline-seg:hover { filter: brightness(1.12); }
  .timeline-seg.active::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
    mix-blend-mode: overlay;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .timeline-now {
    position: absolute; top: -4px; bottom: -4px; width: 2px;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    border-radius: 2px;
    box-shadow:
      0 0 0 1.5px rgba(0,0,0,0.55),
      0 0 14px rgba(255,255,255,0.55),
      0 0 4px rgba(255,255,255,0.9);
    pointer-events: none;
    z-index: 2;
  }
  .timeline-now::before {
    content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #e7e7ea 100%);
    box-shadow:
      0 0 0 2px rgba(0,0,0,0.5),
      0 0 12px rgba(255,255,255,0.7);
  }
  .timeline-now::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #e7e7ea 100%);
    box-shadow:
      0 0 0 2px rgba(0,0,0,0.5),
      0 0 12px rgba(255,255,255,0.7);
  }
  .timeline-axis {
    position: relative; height: 22px; margin-top: 10px;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500;
  }
  .timeline-tick {
    position: absolute; top: 0; transform: translateX(-50%);
    letter-spacing: 0.04em; font-weight: 500;
  }
  .timeline-tick:not(.major)::before {
    content: ''; position: absolute; left: 50%; top: -4px;
    width: 1px; height: 3px; background: var(--border-strong);
    transform: translateX(-50%);
  }
  .timeline-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border); }
  .timeline-legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .timeline-legend-item .d { width: 8px; height: 8px; border-radius: 2px; }
  .timeline-legend-item .v { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: -0.01em; }
  .timeline-empty { color: var(--muted); text-align: center; font-size: 12.5px; padding: 4px 0 0; width: 100%; }

  /* History list */
  .entry { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 4px;
    transition: background .15s, border-color .15s; }
  .entry:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .entry .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .entry .info { flex: 1; min-width: 0; }
  .entry .info .n { font-size: 13.5px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
  .entry .info .t { color: var(--muted); font-size: 11.5px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .entry .dur { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text); font-weight: 500; }
  .entry .menu { padding: 4px 8px; border-radius: 6px; color: var(--muted-2); font-size: 14px; }
  .entry .menu:hover { background: var(--bg); color: var(--text); }
  .day-header { font-size: 11px; color: var(--muted-2); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 18px 2px 8px; font-weight: 600; }
  .day-header span { float: right; font-variant-numeric: tabular-nums; color: var(--muted); letter-spacing: -0.01em; text-transform: none; }

  /* Settings list */
  .cat-list { display: flex; flex-direction: column; gap: 6px; }
  .cat-row { display: flex; align-items: center; gap: 10px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .cat-row input[type="text"] { flex: 1; background: transparent; border: 0; padding: 4px 0; font-size: 13.5px; }
  .cat-row input[type="text"]:focus { box-shadow: none; }
  .cat-row input[type="color"] { width: 28px; height: 28px; border: 1px solid var(--border-strong); padding: 0; background: transparent;
    border-radius: 6px; overflow: hidden; cursor: pointer; flex: none; }
  .cat-row .del { color: var(--muted-2); padding: 6px 8px; border-radius: 6px; font-size: 14px; }
  .cat-row .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .add-cat { background: transparent; border: 1px dashed var(--border-strong); border-radius: 8px;
    padding: 11px; color: var(--muted); width: 100%; text-align: center; font-size: 13px; margin-top: 6px;
    transition: color .15s, border-color .15s; }
  .add-cat:hover { color: var(--text); border-color: var(--muted); }

<script>
/* =========================================================

const SUPABASE_URL = 'https://rdotiwxihcolalrjihtb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jwMKkQlSbir80377fFi-fA_Vbf3uUFz';

/* ---------- Helpers ---------- */
const newId = () => (crypto?.randomUUID?.() || 'id-' + Date.now() + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const fmtDur = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}ч ${m}м`;
  if (m > 0) return `${m}м`;
  return `${sec}с`;
};
const fmtClock = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
};
const catById = (id) => state.categories.find(c => c.id === id);

function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d) {
  const x = startOfDay(d);
  const day = (x.getDay() + 6) % 7; // понедельник = 0
  x.setDate(x.getDate() - day);
  return x;
}
function startOfMonth(d) { const x = startOfDay(d); x.setDate(1); return x; }

/* Calculate ms within entry that overlaps [from, to] */
function overlapMs(entry, from, to, end = null) {
  const s = new Date(entry.start).getTime();
  const e = (entry.end ? new Date(entry.end) : (end || new Date())).getTime();
  const a = Math.max(s, from.getTime());
  const b = Math.min(e, to.getTime());
  return Math.max(0, b - a);
}

/* Aggregate per-category ms over a range (includes active entry) */
function aggregate(from, to) {
  const totals = {};
  state.categories.forEach(c => totals[c.id] = 0);
  state.entries.forEach(e => {
    if (totals[e.catId] === undefined) totals[e.catId] = 0;
    totals[e.catId] += overlapMs(e, from, to);
  });
  if (state.active) {
    const e = { catId: state.active.catId, start: state.active.start, end: null };
    if (totals[e.catId] === undefined) totals[e.catId] = 0;
    totals[e.catId] += overlapMs(e, from, to);
  }
  return totals;
}

/* ---------- Timeline (today, 06:00 → 24:00) ---------- */
const TIMELINE_START_HOUR = 6;

// Восход и закат в Санкт-Петербурге (lat ≈ 60° N).
// Таблица с шагом ~30 дней, между точками — линейная интерполяция.
// Часы в местном времени (MSK, UTC+3).
const SPB_SUN = [
  // [day-of-year, sunrise hours, sunset hours]
  [1,   9.97, 16.07],   // 1 Jan
  [32,  8.97, 17.05],   // 1 Feb
  [60,  7.78, 17.95],   // 1 Mar
  [91,  6.42, 19.78],   // 1 Apr
  [121, 5.05, 20.65],   // 1 May
  [152, 4.00, 22.40],   // 1 Jun
  [173, 3.58, 22.42],   // 22 Jun (longest day)
  [182, 3.80, 22.30],   // 1 Jul
  [213, 4.92, 21.40],   // 1 Aug
  [244, 6.22, 19.85],   // 1 Sep
  [274, 7.53, 18.43],   // 1 Oct
  [305, 8.85, 17.02],   // 1 Nov
  [335, 9.72, 15.92],   // 1 Dec
  [355, 10.02, 15.85],  // 21 Dec (shortest day)
  [366, 9.97, 16.07],   // wrap
];
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function getSunriseSunset(date) {
  const d = dayOfYear(date);
  for (let i = 1; i < SPB_SUN.length; i++) {
    const [d2, sr2, ss2] = SPB_SUN[i];
    if (d <= d2) {
      const [d1, sr1, ss1] = SPB_SUN[i-1];
      const t = (d - d1) / (d2 - d1);
      return { sunrise: sr1 + (sr2 - sr1) * t, sunset: ss1 + (ss2 - ss1) * t };
    }
  }
  return { sunrise: 9.97, sunset: 16.07 };
}
function buildDaylightGradient(date) {
  const { sunrise, sunset } = getSunriseSunset(date);
  const VS = TIMELINE_START_HOUR, VE = 24;
  const span = VE - VS;
  const clamp = p => Math.max(0, Math.min(100, p));
  const pct = h => clamp(((h - VS) / span) * 100);

  // Плавная палитра с длинными переходами через сумерки (как в Apple Weather).
  // Каждая фаза = час до/после восхода/заката + плавная привязка к полудню.
  const phases = [
    // ===== Утренние сумерки и восход (растянуто на ~2.5 часа) =====
    [sunrise - 2.0,  '#08102a'], // глубокая ночь
    [sunrise - 1.5,  '#13183a'], // астрономические сумерки
    [sunrise - 1.0,  '#262050'], // навигационные
    [sunrise - 0.7,  '#3e2868'], // ранние гражданские (индиго→фиолет)
    [sunrise - 0.45, '#6b3478'], // фиолетово-розовые
    [sunrise - 0.25, '#a04a78'], // розовый
    [sunrise - 0.1,  '#d8635a'], // коралловый
    [sunrise,        '#ff8e54'], // восход — золотой час
    [sunrise + 0.3,  '#ffaa6c'], // тёплый янтарь
    [sunrise + 0.8,  '#ffc88a'], // утренний амбер
    [sunrise + 1.5,  '#ffdcaa'], // мягкий крем
    [sunrise + 2.5,  '#fee9c2'], // светлое утро

    // ===== Дневное плато =====
    [12.0,           '#fff1d6'], // полдень — светлый кремово-белый
    [13.0,           '#fff1d6'], // плато
    [14.0,           '#fff0d2'],

    // ===== Послеобеденная тёплая фаза и закат =====
    [sunset - 2.5,   '#fee9c2'],
    [sunset - 1.5,   '#ffd9a8'],
    [sunset - 0.8,   '#ffbe82'], // тёплый янтарь
    [sunset - 0.4,   '#ff9a5c'], // золотой час
    [sunset - 0.15,  '#ff7547'], // насыщённый оранжевый
    [sunset,         '#ff5e3e'], // закат — пик
    [sunset + 0.15,  '#d34a5c'], // красно-розовый
    [sunset + 0.3,   '#9c3a6c'], // лиловый
    [sunset + 0.5,   '#5a2868'], // фиолетово-сумеречный
    [sunset + 0.75,  '#3a2055'], // гражданские сумерки
    [sunset + 1.0,   '#222048'], // навигационные
    [sunset + 1.5,   '#13183a'], // астрономические
    [sunset + 2.0,   '#08102a'], // ночь
  ];

  // Группируем фазы относительно окна просмотра: что вне — клампим к краю,
  // оставляем только последнюю фазу слева и первую справа.
  let leftColor = null;
  let rightColor = null;
  const inView = [];
  for (const [h, c] of phases) {
    if (h <= VS) { leftColor = c; continue; }
    if (h >= VE) { if (!rightColor) rightColor = c; continue; }
    inView.push([pct(h), c]);
  }
  const stops = [];
  if (leftColor) stops.push(`${leftColor} 0%`);
  else if (inView.length) stops.push(`${inView[0][1]} 0%`);
  for (const [p, c] of inView) stops.push(`${c} ${p.toFixed(2)}%`);
  if (rightColor) stops.push(`${rightColor} 100%`);
  else if (inView.length) stops.push(`${inView[inView.length-1][1]} 100%`);
  if (stops.length === 0) stops.push('#08102a 0%', '#08102a 100%');

  return `linear-gradient(90deg, ${stops.join(', ')})`;
}

function renderTimeline() {
  const track = document.getElementById('timeline-track');
  const axis = document.getElementById('timeline-axis');
  if (!track) return;

  const dayStart = startOfDay(new Date());
  const dayEnd = new Date(dayStart.getTime() + 86400000);
  const nowDate = new Date();

  // Окно просмотра — 06:00 → 24:00
  const viewStart = new Date(dayStart.getTime() + TIMELINE_START_HOUR * 3600000);
  const viewEnd = dayEnd;

  // Сегодняшние сегменты, обрезанные по окну
  const segs = [];
  state.entries.forEach(e => {
    const s = new Date(e.start), en = new Date(e.end);
    if (en <= viewStart || s >= viewEnd) return;
    segs.push({ catId: e.catId, start: Math.max(s, viewStart), end: Math.min(en, viewEnd) });
  });
  if (state.active) {
    const s = new Date(state.active.start);
    const en = nowDate;
    if (en > viewStart && s < viewEnd) {
      segs.push({ catId: state.active.catId, start: Math.max(s, viewStart), end: Math.min(en, viewEnd), active: true });
    }
  }

  const viewSpan = viewEnd - viewStart;
  const pct = (t) => ((t - viewStart) / viewSpan) * 100;

  // Daylight strip
  const daylight = document.getElementById('timeline-daylight');
  if (daylight) daylight.style.backgroundImage = buildDaylightGradient(nowDate);

  // Сегменты (визуально клиппятся к окну 06:00 — 24:00)
  track.innerHTML = '';
  segs.forEach(s => {
    const c = catById(s.catId);
    if (!c) return;
    const left = pct(s.start);
    const width = pct(s.end) - left;
    if (width <= 0) return;
    const div = document.createElement('div');
    div.className = 'timeline-seg' + (s.active ? ' active' : '');
    div.style.cssText = `left:${left}%; width:${width}%; --c:${c.color}`;
    const dur = (s.end - s.start);
    div.title = `${c.name} · ${fmtTime(new Date(s.start))}–${s.active ? 'сейчас' : fmtTime(new Date(s.end))} · ${fmtDur(dur)}`;
    track.appendChild(div);
  });
  // Totals для блока «Сегодня» — за полные сутки (включая ночь)
  const totals = aggregate(dayStart, dayEnd);

  // "Сейчас" маркер (только если nowDate в окне)
  if (nowDate >= viewStart && nowDate <= viewEnd) {
    const nowMark = document.createElement('div');
    nowMark.className = 'timeline-now';
    nowMark.style.left = `calc(${pct(nowDate)}% - 1px)`;
    track.appendChild(nowMark);
  }

  // Ось часов: 06:00 → 24:00, тики каждые 3 часа. Лейблы: 06, 12, 18, 00 (полночь)
  axis.innerHTML = '';
  for (let h = TIMELINE_START_HOUR; h <= 24; h += 3) {
    const t = new Date(dayStart.getTime() + h * 3600000);
    const tick = document.createElement('div');
    const isMajor = (h === TIMELINE_START_HOUR || h === 12 || h === 18 || h === 24);
    tick.className = 'timeline-tick' + (isMajor ? ' major' : '');
    if (h === TIMELINE_START_HOUR) {
      tick.style.left = '0%';
      tick.style.transform = 'translateX(0)';
    } else if (h === 24) {
      tick.style.left = '100%';
      tick.style.transform = 'translateX(-100%)';
    } else {
      tick.style.left = pct(t) + '%';
    }
    if (isMajor) {
      const hh = h === 24 ? 0 : h;
      tick.textContent = String(hh).padStart(2, '0') + ':00';
    }
    axis.appendChild(tick);
  }

  const dayTotal = Object.values(totals).reduce((a, b) => a + b, 0);
  renderTodayStats(totals, dayTotal);
}

function renderTodayStats(totals, dayTotal) {
  const list = document.getElementById('today-stats-list');
  if (!list) return;
  list.innerHTML = '';
  if (!dayTotal) {
    list.innerHTML = '<div class="stats-empty">Запусти трекер, чтобы увидеть статистику</div>';
    return;
  }
  state.categories
    .map(c => ({ c, ms: totals[c.id] || 0 }))
    .filter(x => x.ms > 0)
    .sort((a, b) => b.ms - a.ms)
    .forEach(({ c, ms }) => {
      const pct = (ms / dayTotal) * 100;
      const row = document.createElement('div');
      row.className = 'stats-row';
      row.innerHTML = `
        <div class="dot" style="background:${c.color}"></div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="val">${fmtDur(ms)} · ${pct.toFixed(0)}%</div>
        <div class="stats-bar"><div style="width:${pct}%; background:${c.color}"></div></div>
      `;
      list.appendChild(row);
    });
}

function renderNow() {
  const nowEl = document.getElementById('now');
  if (state.active) {
    const c = catById(state.active.catId);
    if (!c) { state.active = null; renderNow(); return; }
    nowEl.classList.remove('idle');
    nowEl.classList.add('running');
    nowEl.style.setProperty('--c', c.color);
    document.getElementById('now-name').textContent = c.name;
    tick();
  } else {
    nowEl.classList.add('idle');
    nowEl.classList.remove('running', 'warn');
  }
  updateStaleBanner();
}

function updateStaleBanner() {
  const banner = document.getElementById('stale-banner');
  if (!banner) return;
  if (!state.active) { banner.style.display = 'none'; return; }
  const start = new Date(state.active.start);
  const ageMs = Date.now() - start.getTime();
  const SIX_HOURS = 6 * 3600 * 1000;
  if (ageMs < SIX_HOURS) { banner.style.display = 'none'; return; }
  const c = catById(state.active.catId);
  if (!c) { banner.style.display = 'none'; return; }
  const hours = Math.floor(ageMs / 3600000);
  const dateLabel = start.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  banner.style.display = 'block';
  banner.innerHTML = `
    ⚠ Таймер «${escapeHtml(c.name)}» идёт <b>${hours} ч</b> — с ${dateLabel}.<br>
    <button onclick="closeActiveAtStartDayEnd()" style="margin-top:8px; padding:8px 12px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fcd34d; border-radius:8px; font-size:12.5px; cursor:pointer;">
      Закрыть таймер на 23:59 ${start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}
    </button>
    <button onclick="document.getElementById('stale-banner').style.display='none'" style="margin-top:8px; margin-left:8px; padding:8px 12px; background:transparent; border:1px solid rgba(255,255,255,0.18); color:#fcd34d; border-radius:8px; font-size:12.5px; cursor:pointer;">
      Скрыть
    </button>
  `;
}

function closeActiveAtStartDayEnd() {
  if (!state.active) return;
  const start = new Date(state.active.start);
  // Конец дня старта = следующий день 00:00 минус 1 мс
  const endOfStartDay = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1, 0, 0, 0, -1);
  const t = endOfStartDay.toISOString();
  const closing = state.active;
  state.entries.unshift({ id: closing.id, catId: closing.catId, start: closing.start, end: t });
  state.active = null;
  saveCache();
  renderGrid();
  if (currentTab === 'history') renderHistory();
  mutate({ op: 'update', table: 'entries', payload: { end_at: t }, where: { id: closing.id } });
}

function stopActive() {
  console.log('[stopActive] state.active =', state.active);
  if (!state.active) {
    // Fallback: даже если local state потерян, чистим UI
    document.getElementById('now').classList.remove('running', 'warn');
    document.getElementById('now').classList.add('idle');
    return;
  }
  toggleCategory(state.active.catId);
}

// Принудительный сброс ВСЕХ активных таймеров (закрывает зомби-записи на сервере)
async function forceStopActive() {
  const t = now();
  state.active = null;
  saveCache();
  document.getElementById('now').classList.remove('running', 'warn');
  document.getElementById('now').classList.add('idle');
  renderGrid();
  try {
    const { error, count } = await sb.from('entries')
      .update({ end_at: t }, { count: 'exact' })
      .is('end_at', null);
    if (error) { alert('Ошибка: ' + error.message); return; }
    await loadAll();
    saveCache();
    renderGrid();
    alert('Закрыто активных записей на сервере: ' + (count ?? '?'));
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function tick() {
  if (!state.active) return;
  const ms = Date.now() - new Date(state.active.start).getTime();
  const clock = fmtClock(ms);
  document.getElementById('now-time').textContent = clock;
  const inGrid = document.getElementById('cat-running-' + state.active.catId);
  if (inGrid) inGrid.textContent = clock;

  // Warning state after threshold
  const limitMs = (state.warnMinutes || 25) * 60 * 1000;
  const nowEl = document.getElementById('now');
  nowEl.classList.toggle('warn', ms >= limitMs);

  // Live timeline tick
  if (currentTab === 'track' && Math.floor(ms / 1000) % 5 === 0) renderTimeline();
}

/* ---------- Tracker actions ---------- */
function toggleCategory(catId) {
  console.log('[toggleCategory]', catId, 'state.active=', state.active, 'session=', !!session);
  if (!session) { console.warn('toggleCategory: no session'); return; }
  const t = now();
  const uid_ = session.user.id;
  const wasActive = !!state.active;
  if (state.active) {
    const wasSame = state.active.catId === catId;
    const closingId = state.active.id;
    const closingStart = state.active.start;
    const closingCat = state.active.catId;
    state.entries.unshift({ id: closingId, catId: closingCat, start: closingStart, end: t });
    const newActive = wasSame ? null : { id: newId(), catId, start: t };
    state.active = newActive;
    saveCache();
    renderGrid();
    mutate({ op: 'update', table: 'entries', payload: { end_at: t }, where: { id: closingId } });
    if (newActive) {
      mutate({ op: 'insert', table: 'entries', payload: {
        id: newActive.id, user_id: uid_, category_id: catId, start_at: t
      }});
    }
  } else {
    const id = newId();
    state.active = { id, catId, start: t };
    saveCache();
    renderGrid();
    mutate({ op: 'insert', table: 'entries', payload: {
      id, user_id: uid_, category_id: catId, start_at: t
    }});
  }
  if (currentTab === 'history') renderHistory();
}

/* ---------- Stats ---------- */
function setRange(r) {
  currentRange = r;
  document.querySelectorAll('.range-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.range === r);
  });
  closeRangePicker();
  syncPickerToRange();
  renderStats();
}

function endOfMonth(d) { const x = new Date(d.getFullYear(), d.getMonth() + 1, 0); x.setHours(23,59,59,999); return x; }
function endOfDay(d) { const x = startOfDay(d); x.setHours(23,59,59,999); return x; }
function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function rangeBounds() {
  const now = new Date();
  if (currentRange === 'day') {
    return { from: startOfDay(now), to: now };
  }
  if (currentRange === 'yesterday') {
    const yStart = startOfDay(new Date(now.getTime() - 86400000));
    const yEnd   = startOfDay(now); // exclusive
    return { from: yStart, to: yEnd };
  }
  if (currentRange === 'week') {
    // Текущая неделя: с понедельника по текущий момент
    return { from: startOfWeek(now), to: now };
  }
  if (currentRange === 'month') {
    // Текущий календарный месяц: с 1-го числа по последний день
    return { from: startOfMonth(now), to: endOfMonth(now) };
  }
  if (currentRange === 'custom' && customFrom && customTo) {
    return { from: startOfDay(customFrom), to: endOfDay(customTo) };
  }
  return { from: startOfDay(now), to: now };
}

function rangeLabel() {
  const { from, to } = rangeBounds();
  const fmt = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  if (currentRange === 'day')       return 'сегодня';
  if (currentRange === 'yesterday') return 'вчера';
  if (currentRange === 'week')      return `${fmt(from)} — сегодня`;
  if (currentRange === 'month')     return `${fmt(from)} — ${fmt(to)}`;
  return `${fmt(from)} — ${fmt(new Date(to.getTime() - 1))}`;
}

/* ---------- Range picker (календарь: 1-й клик — начало, 2-й — конец) ---------- */
function syncPickerToRange() {
  const { from, to } = rangeBounds();
  selStart = startOfDay(from);
  const lastMs = startOfDay(new Date(to.getTime() - 1));
  selEnd   = lastMs >= selStart ? lastMs : selStart;
  pendingStart = null;
  calMonth = new Date(selStart.getFullYear(), selStart.getMonth(), 1);
  updateRangeField();
  if (!document.getElementById('range-cal')?.classList.contains('hidden')) renderCal();
}

function updateRangeField() {
  const el = document.getElementById('range-field-text');
  if (!el) return;
  const fmt = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
  if (pendingStart) {
    el.textContent = `${fmt(pendingStart)} — …`;
  } else if (selStart && selEnd) {
    el.textContent = sameDay(selStart, selEnd) ? fmt(selStart) : `${fmt(selStart)} — ${fmt(selEnd)}`;
  } else {
    el.textContent = 'Выбрать период';
  }
}

function toggleRangePicker(ev) {
  ev?.stopPropagation();
  const cal = document.getElementById('range-cal');
  if (!cal) return;
  if (cal.classList.contains('hidden')) openRangePicker(); else closeRangePicker();
}

function openRangePicker() {
  const cal = document.getElementById('range-cal');
  if (!cal) return;
  pendingStart = null;
  calHover = null;
  if (selStart) calMonth = new Date(selStart.getFullYear(), selStart.getMonth(), 1);
  cal.classList.remove('hidden');
  document.getElementById('range-field')?.classList.add('open');
  renderCal();
}

function closeRangePicker() {
  const cal = document.getElementById('range-cal');
  if (!cal) return;
  cal.classList.add('hidden');
  document.getElementById('range-field')?.classList.remove('open');
  pendingStart = null;
  calHover = null;
  updateRangeField();
}

function calShift(delta) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  renderCal();
}

// Строим сетку месяца. Ноды создаются один раз — перекраска идёт через paintCal(),
// иначе пересборка на hover съедала бы клик (mousedown и mouseup на разных нодах).
function renderCal() {
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-title');
  if (!grid) return;

  title.textContent = calMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

  // Начинаем сетку с понедельника
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - offset);

  const today = startOfDay(new Date());
  grid.innerHTML = '';
  calCells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day';
    btn.textContent = d.getDate();
    if (d.getMonth() !== calMonth.getMonth()) btn.classList.add('out');
    if (sameDay(d, today)) btn.classList.add('today');
    btn.onclick = (ev) => { ev.stopPropagation(); pickDate(d); };
    btn.onmouseenter = () => { if (pendingStart) { calHover = d; paintCal(); } };
    grid.appendChild(btn);
    calCells.push({ btn, d });
  }
  paintCal();
}

// Перекрашивает подсветку периода, не трогая ноды
function paintCal() {
  const hint = document.getElementById('cal-hint');
  if (hint) hint.textContent = pendingStart ? 'Теперь выбери конец периода' : 'Выбери начало периода';

  // Что подсвечиваем: подтверждённый период или превью от pendingStart к курсору
  let hiFrom = selStart, hiTo = selEnd;
  if (pendingStart) {
    const other = calHover || pendingStart;
    hiFrom = pendingStart <= other ? pendingStart : other;
    hiTo   = pendingStart <= other ? other : pendingStart;
  }

  calCells.forEach(({ btn, d }) => {
    const inside = hiFrom && hiTo && d >= hiFrom && d <= hiTo;
    btn.classList.toggle('edge', !!inside && (sameDay(d, hiFrom) || sameDay(d, hiTo)));
    btn.classList.toggle('in-range', !!inside && !sameDay(d, hiFrom) && !sameDay(d, hiTo));
  });
}

function pickDate(d) {
  if (!pendingStart) {
    // Первый клик — начало периода
    pendingStart = startOfDay(d);
    calHover = null;
    updateRangeField();
    paintCal();
    return;
  }
  // Второй клик — конец периода (порядок кликов не важен)
  const a = pendingStart, b = startOfDay(d);
  selStart = a <= b ? a : b;
  selEnd   = a <= b ? b : a;
  pendingStart = null;
  calHover = null;

  customFrom = selStart;
  customTo = selEnd;
  currentRange = 'custom';
  document.querySelectorAll('.range-switch button').forEach(x => x.classList.remove('active'));
  closeRangePicker();
  renderStats();
}

document.addEventListener('click', (ev) => {
  const picker = document.getElementById('range-picker');
  if (picker && !picker.contains(ev.target)) closeRangePicker();
});
function renderStats() {
  const { from, to } = rangeBounds();
  const totals = aggregate(from, to);
  const totalMs = Object.values(totals).reduce((a,b) => a+b, 0);
  document.getElementById('stats-total').textContent = totalMs > 0 ? fmtDur(totalMs) : '—';
  const label = document.getElementById('stats-range-label');
  if (label) label.textContent = rangeLabel();

  const list = document.getElementById('stats-list');
  list.innerHTML = '';
  if (totalMs === 0) {
    list.innerHTML = '<div class="stats-empty">Нет данных за период</div>';
    return;
  }
  // Sort by ms desc
  const sorted = state.categories
    .map(c => ({ c, ms: totals[c.id] || 0 }))
    .sort((a,b) => b.ms - a.ms);

  sorted.forEach(({ c, ms }) => {
    if (ms === 0) return;
    const pct = totalMs > 0 ? (ms / totalMs * 100) : 0;
    const row = document.createElement('div');
    row.className = 'stats-row';
    row.innerHTML = `
      <div class="dot" style="background:${c.color}"></div>
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="val">${fmtDur(ms)} · ${pct.toFixed(0)}%</div>
      <div class="stats-bar"><div style="width:${pct}%; background:${c.color}"></div></div>
    `;
    list.appendChild(row);
  });
}

/* ---------- History ---------- */
function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!state.entries.length && !state.active) {
    list.innerHTML = '<div class="stats-empty">Пока пусто</div>';
    return;
  }
  // Группируем по дню. Записи пересекающие полночь — делим на per-day слайсы.
  const byDay = {};
  const all = [...state.entries];
  if (state.active) all.push({ id: '__active', catId: state.active.catId, start: state.active.start, end: null, _active: true });
  all.forEach(e => {
    const start = new Date(e.start);
    const end = e.end ? new Date(e.end) : new Date();
    let dStart = startOfDay(start);
    while (dStart < end) {
      const dEnd = new Date(dStart.getTime() + 86400000);
      const sliceStart = start > dStart ? start : dStart;
      const sliceEnd = end < dEnd ? end : dEnd;
      const dKey = dStart.toISOString();
      (byDay[dKey] = byDay[dKey] || []).push({
        ...e,
        _sliceStart: sliceStart.toISOString(),
        _sliceEnd: sliceEnd.toISOString(),
        _isSlice: start < dStart || end > dEnd,
      });
      dStart = dEnd;
    }
  });
  // Сортируем дни по убыванию + внутри дня по убыванию начала слайса
  Object.values(byDay).forEach(arr => arr.sort((a, b) =>
    new Date(b._sliceStart || b.start) - new Date(a._sliceStart || a.start)
  ));

  Object.keys(byDay).sort().reverse().forEach(dKey => {
    const date = new Date(dKey);
    const entries = byDay[dKey];
    const dayTotal = entries.reduce((sum, e) => {
      const start = new Date(e._sliceStart || e.start);
      const end = e._sliceEnd ? new Date(e._sliceEnd) : (e.end ? new Date(e.end) : new Date());
      return sum + (end - start);
    }, 0);
    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `${formatDayHeader(date)} <span>${fmtDur(dayTotal)}</span>`;
    list.appendChild(header);

    entries.forEach(e => {
      const c = catById(e.catId);
      if (!c) return;
      const start = new Date(e._sliceStart || e.start);
      const end = (e._sliceEnd ? new Date(e._sliceEnd) : (e.end ? new Date(e.end) : new Date()));
      const dur = end - start;
      const sliceMark = e._isSlice ? ' (продолжение)' : '';
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="dot" style="background:${c.color}"></div>
        <div class="info">
          <div class="n">${escapeHtml(c.name)}${e._active ? ' · идёт' : ''}${sliceMark}</div>
          <div class="t">${fmtTime(start)} – ${e._active ? 'сейчас' : fmtTime(end)}</div>
        </div>
        <div class="dur">${fmtDur(dur)}</div>
      `;
      if (!e._active) {
        row.style.cursor = 'pointer';
        row.onclick = () => openEdit(e.id);
        const del = document.createElement('button');
        del.className = 'menu';
        del.innerHTML = '✕';
        del.title = 'Удалить';
        del.onclick = (ev) => {
          ev.stopPropagation();
          if (!confirm('Удалить запись «' + c.name + '» от ' + fmtTime(start) + '?')) return;
          editingEntryId = e.id;
          deleteEntry();
        };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
  });
}

function formatDayHeader(d) {
  const today = startOfDay(new Date());
  const that = startOfDay(d);
  const diff = (today - that) / 86400000;
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtTime(d) {
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

/* ---------- Edit entry ---------- */
let editingMode = 'edit'; // 'edit' | 'new'

function _populateEditCatSelect(selectedId) {
  const sel = document.getElementById('edit-cat');
  sel.innerHTML = '';
  state.categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;

}

function openEdit(id) {
  editingMode = 'edit';
  editingEntryId = id;
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  _populateEditCatSelect(e.catId);
  document.getElementById('edit-start').value = toLocalInput(new Date(e.start));
  document.getElementById('edit-end').value = toLocalInput(new Date(e.end));

  document.getElementById('edit-modal-delete').style.display = '';
  document.getElementById('edit-modal').classList.remove('hidden');
}

function openAddEntry() {
  editingMode = 'new';
  editingEntryId = null;
  // Дефолт: последний час, текущая (или первая) категория
  const end = new Date();
  const start = new Date(end.getTime() - 3600000);
  const defaultCatId = state.active?.catId || state.categories[0]?.id;
  _populateEditCatSelect(defaultCatId);
  document.getElementById('edit-start').value = toLocalInput(start);
  document.getElementById('edit-end').value = toLocalInput(end);
  document.getElementById('edit-modal-title').textContent = 'Новая запись';
  document.getElementById('edit-modal-delete').style.display = 'none';
  document.getElementById('edit-modal').classList.remove('hidden');
}

function closeEdit() {
  // Автосохранение/создание при закрытии
  if (editingMode === 'new') {
    const s = new Date(document.getElementById('edit-start').value);
    const en = new Date(document.getElementById('edit-end').value);
    const cat = document.getElementById('edit-cat').value;
    if (!isNaN(s) && !isNaN(en) && en > s && cat && session) {
      const id = newId();
      const entry = { id, catId: cat, start: s.toISOString(), end: en.toISOString() };
      state.entries.unshift(entry);
      saveCache();
      mutate({ op: 'insert', table: 'entries', payload: {
        id, user_id: session.user.id, category_id: cat,
        start_at: entry.start, end_at: entry.end
      }});
      renderHistory();
      if (currentTab === 'track') renderGrid();
      if (currentTab === 'stats') renderStats();
    }
  } else if (editingEntryId) {
    const e = state.entries.find(x => x.id === editingEntryId);
    if (e) {
      const s = new Date(document.getElementById('edit-start').value);
      const en = new Date(document.getElementById('edit-end').value);
      const cat = document.getElementById('edit-cat').value;
      if (!isNaN(s) && !isNaN(en) && en > s && cat) {
        const start = s.toISOString();
        const end = en.toISOString();
        if (cat !== e.catId || start !== e.start || end !== e.end) {
          e.catId = cat; e.start = start; e.end = end;
          saveCache();
          mutate({ op: 'update', table: 'entries',
            payload: { category_id: cat, start_at: start, end_at: end },
            where: { id: e.id }
          });
          renderHistory(); renderGrid();
          if (currentTab === 'stats') renderStats();
        }
      }
    }
  }
  document.getElementById('edit-modal').classList.add('hidden');
  editingEntryId = null;
  editingMode = 'edit';
}

function saveEdit() {
  // Валидация перед закрытием
  const s = new Date(document.getElementById('edit-start').value);
  const en = new Date(document.getElementById('edit-end').value);
  if (isNaN(s) || isNaN(en) || en <= s) { alert('Неверные даты'); return; }
  if (editingMode === 'edit') {
    const e = state.entries.find(x => x.id === editingEntryId);
    if (!e) { closeEdit(); return; }
  }
  closeEdit();
}
function deleteEntry() {
  if (!confirm('Удалить запись?')) return;
  const id = editingEntryId;
  state.entries = state.entries.filter(x => x.id !== id);
  saveCache();
  closeEdit();
  renderHistory(); renderGrid();
  if (currentTab === 'stats') renderStats();
  // Soft delete вместо физического — всегда восстановимо через SQL
  mutate({ op: 'update', table: 'entries',
    payload: { deleted_at: new Date().toISOString() }, where: { id } });
}
function toLocalInput(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function addCategory() {
  saveAllCategories();
  const palette = ['#5e6ad2','#10b981','#f59e0b','#06b6d4','#ec4899','#a855f7','#f43f5e','#14b8a6','#eab308','#3b82f6','#84cc16'];
  const used = new Set(state.categories.map(c => c.color.toLowerCase()));
  const color = palette.find(p => !used.has(p.toLowerCase())) || palette[Math.floor(Math.random() * palette.length)];
  const id = newId();
  const position = state.categories.length;
  state.categories.push({ id, name: 'Новая категория', color, position });
  saveCache();
  renderSettingsCats();

  }});

function removeCategory(i) {
  syncSettingsInputs();
  const c = state.categories[i];
  if (!c) return;
  const hasEntries = state.entries.some(e => e.catId === c.id);
  const isActive = state.active && state.active.catId === c.id;
  if (hasEntries || isActive) {
    if (!confirm(`У категории "${c.name}" есть записи. Удалить категорию и все её записи?`)) return;
  }
  state.categories.splice(i, 1);
  state.entries = state.entries.filter(e => e.catId !== c.id);
  if (isActive) state.active = null;
  saveCache();
  renderSettingsCats();
  // Soft delete категории + soft delete её записей (две мутации)
  mutate({ op: 'update', table: 'categories',
    payload: { deleted_at: new Date().toISOString() }, where: { id: c.id } });
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

/* ---------- Auth ---------- */
const withTimeoutP = (p, ms, label) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout: ' + label)), ms))
]);

async function getSessionWithRetry(retries = 2) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try {
      return await withTimeoutP(sb.auth.getSession(), 15000, 'getSession');
    } catch (e) {
      lastErr = e;
      console.warn(`getSession attempt ${i+1} failed:`, e.message);
      if (i < retries) await new Promise(r => setTimeout(r, 800));
    }
  }
  throw lastErr;
}

async function bootAuth() {
  const hasCache = document.documentElement.classList.contains('authed') && loadCache();
  if (hasCache) renderGrid();
  try {
    const { data: { session: s0 } } = await getSessionWithRetry(2);
    let s = s0;
    if (s0 && s0.refresh_token) {
      try {
        const r = await withTimeoutP(sb.auth.refreshSession(), 15000, 'refreshSession');
        if (!r.error && r.data.session) s = r.data.session;
      } catch (e) { console.warn('refreshSession failed, using existing:', e); }
    }
    await applySession(s);
    // Подписываемся только на явный SIGNED_OUT (например, токен протух)
    // Логин и token refresh уже триггерят applySession через signInPassword/getSession.
    sb.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') applySession(null);
    });
  } catch (e) {
    console.error('bootAuth failed:', e);
    // Если есть кэш — тихо логируем, юзера не пугаем
    if (!hasCache) {
      const diag = document.getElementById('diag-banner');
      if (diag) { diag.style.display = 'block'; diag.textContent = 'Ошибка авторизации: ' + e.message; }
    }
    // Через 5с попробуем ещё раз поднять сессию
    setTimeout(() => bootAuth(), 5000);
  }
}

const CACHE_KEY = 'tracker.cache.v1';

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const c = JSON.parse(raw);
    state.categories = c.categories || [];
    state.entries = c.entries || [];
    state.active = c.active || null;
    state.warnMinutes = c.warnMinutes || 25;
    return state.categories.length > 0;
  } catch { return false; }
}

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      categories: state.categories,
      entries: state.entries.slice(0, 500),
      active: state.active,
      warnMinutes: state.warnMinutes,
    }));
  } catch {}
}

async function applySession(s) {
  session = s;
  const html = document.documentElement;
  if (s) {
    try {
      document.getElementById('user-email').textContent = s.user.email;
      html.classList.add('authed');
      // 1. Мгновенный рендер из кэша если есть
      if (loadCache()) renderGrid();
      updateQueueBadge();
      if (queue.length > 0) processQueue();
      await loadAll();
      saveCache();
      renderGrid();
      setupRealtime();
      // Диагностика: если данные пустые — показываем баннер
      const diag = document.getElementById('diag-banner');
      if (diag) {
        if (state.categories.length === 0) {
          diag.style.display = 'block';
          diag.innerHTML = `Аккаунт <b>${escapeHtml(s.user.email)}</b><br>Категорий нет в базе. Проверь что ты вошёл правильным аккаунтом, или перезалейте дефолтные категории через SQL Editor.`;
        } else {
          diag.style.display = 'none';
        }
      }
    } catch (e) {
      console.error('applySession failed:', e);
      const diag = document.getElementById('diag-banner');
      if (diag && state.categories.length > 0) {
        // Кэш есть — показываем его, ошибку выводим как баннер
        diag.style.display = 'block';
        diag.textContent = 'Не удалось обновить: ' + (e.message || e);
      } else if (state.categories.length === 0) {
        // Нет ни кэша, ни данных — на гейт с ошибкой
        html.classList.remove('authed');
        const status = document.getElementById('gate-status');
        if (status) { status.style.color = 'var(--danger)'; status.textContent = 'Ошибка загрузки: ' + (e.message || e); }
      }
    }
  } else {
    html.classList.remove('authed');
    if (realtime) { sb.removeChannel(realtime); realtime = null; }
    // МУТИРУЕМ state, а не реассайн — window.state и другие ссылки должны остаться актуальными
    state.categories.length = 0;
    state.entries.length = 0;
    state.active = null;
    state.warnMinutes = 25;
    try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem(QUEUE_KEY); } catch {}
    queue.length = 0;
    updateQueueBadge();
  }
}

async function signInPassword() {
  const email = document.getElementById('gate-email').value.trim();
  const password = document.getElementById('gate-password').value;
  const status = document.getElementById('gate-status');

  btn.disabled = true; status.style.color = 'var(--muted)'; status.textContent = 'Вход...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data || !data.session) {
      throw new Error('Сессия не получена. Возможно, требуется подтвердить email.');
    }
    status.style.color = '#10b981'; status.textContent = 'Загрузка...';
    await applySession(data.session);
  } catch (e) {
    console.error('signIn:', e);
    status.style.color = 'var(--danger)';
    status.textContent = 'Ошибка: ' + (e.message || e);
  } finally {
    btn.disabled = false;
  }

/* ---------- Data load ---------- */
async function loadAll() {
  if (!session) throw new Error('Нет активной сессии');
  const withTimeout = (p, ms = 30000, label = 'query') => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error('Таймаут: ' + label)), ms))
  ]);
  // Категории — критично, грузим первыми. Учитываем soft delete.
  const cats = await withTimeout(
    sb.from('categories').select('*').is('deleted_at', null).order('position'),
    30000, 'categories'
  );
  if (cats.error) throw new Error('categories: ' + cats.error.message);
  // МУТИРУЕМ массивы вместо реассайна, чтобы window.state и подписчики оставались актуальными
  state.categories.length = 0;
  (cats.data || []).forEach(c => state.categories.push({
    id: c.id, name: c.name, color: c.color, position: c.position
  }));
  // После категорий уже можно частично рендерить
  saveCache(); renderGrid();

  // Settings и entries — параллельно
  const [ents, settings] = await Promise.all([
    withTimeout(
      sb.from('entries').select('*').is('deleted_at', null)
        .order('start_at', { ascending: false }).limit(2000),
      30000, 'entries'
    ),
    withTimeout(sb.from('settings').select('*').maybeSingle(), 15000, 'settings')
  ]);
  if (ents.error)     throw new Error('entries: ' + ents.error.message);
  if (settings.error) throw new Error('settings: ' + settings.error.message);

  state.entries.length = 0;
  state.active = null;
  (ents.data || []).forEach(e => {
    if (e.end_at === null) {
      state.active = { id: e.id, catId: e.category_id, start: e.start_at };
    } else {
      state.entries.push({ id: e.id, catId: e.category_id, start: e.start_at, end: e.end_at });
    }
  });
  state.warnMinutes = settings.data?.warn_minutes || 25;
}

/* ---------- Offline-first mutation queue ---------- */
const QUEUE_KEY = 'tracker.queue.v1';
let queue = (() => { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch { return []; } })();
let queueProcessing = false;

function saveQueue() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch {}
  updateQueueBadge();
}

function updateQueueBadge() {
  const tabs = document.querySelectorAll('.tab');
  const settingsTab = tabs[tabs.length - 1];
  if (!settingsTab) return;
  let badge = settingsTab.querySelector('.tab-badge');
  if (queue.length > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'tab-badge';
      settingsTab.appendChild(badge);
    }
    badge.title = queue.length + ' изменений ждут синхронизации';
  } else if (badge) {
    badge.remove();
  }
}

let lastMutationAt = 0;
function mutate(op) {
  lastMutationAt = Date.now();
  queue.push(op);
  saveQueue();
  processQueue();
}

async function execOp(item) {
  const { op, table, payload, where } = item;
  const withTimeout = (p) => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error('execOp timeout')), 10000))
  ]);
  let result;
  if (op === 'insert')      result = await withTimeout(sb.from(table).insert(payload));
  else if (op === 'update') result = await withTimeout(sb.from(table).update(payload).eq('id', where.id));
  else if (op === 'delete') result = await withTimeout(sb.from(table).delete().eq('id', where.id));
  else if (op === 'upsert') result = await withTimeout(sb.from(table).upsert(payload));
  else throw new Error('unknown op: ' + op);
  if (result.error) {
    if (op === 'insert' && (result.error.code === '23505' || /duplicate/i.test(result.error.message))) return;
    if (op === 'delete' && result.error.code === 'PGRST116') return;
    throw new Error(result.error.message || JSON.stringify(result.error));
  }
}

async function processQueue() {
  if (queueProcessing) return;
  if (!session) return;
  if (!navigator.onLine) return;
  queueProcessing = true;
  let drained = false;
  try {
    while (queue.length > 0 && navigator.onLine) {
      const item = queue[0];
      try {
        await execOp(item);
        queue.shift();
        saveQueue();
      } catch (e) {
        item.attempts = (item.attempts || 0) + 1;
        item.lastError = String(e.message || e);
        item.firstFailedAt = item.firstFailedAt || Date.now();
        saveQueue();
        console.warn('queue item failed (attempt ' + item.attempts + '):', item, e);
        // Не дропаем — пусть лучше копится в очереди, чем терять данные
        break;
      }
    }
    drained = (queue.length === 0);
  } finally {
    queueProcessing = false;
  }
  updateStuckBanner();
  if (drained && session) syncSoon();
}

function updateStuckBanner() {
  const banner = document.getElementById('stuck-banner');
  if (!banner) return;
  if (queue.length === 0) { banner.style.display = 'none'; return; }
  // Самый старый зависший item
  const stuckMs = queue.reduce((oldest, it) => {
    if (!it.firstFailedAt) return oldest;
    return Math.min(oldest, it.firstFailedAt);
  }, Date.now());
  const ageSec = Math.floor((Date.now() - stuckMs) / 1000);
  if (ageSec < 60) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.innerHTML = `
    ⚠ ${queue.length} ${queue.length === 1 ? 'изменение не отправлено' : 'изменений не отправлены'} на сервер (${ageSec >= 60 ? Math.floor(ageSec/60) + ' мин' : ageSec + ' с'}).<br>
    <button onclick="processQueue()" style="margin-top:8px; padding:8px 12px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fcd34d; border-radius:8px; font-size:12.5px; cursor:pointer;">Попробовать сейчас</button>
    <button onclick="if(confirm('Удалить зависшие изменения? Они не будут синхронизированы.')) { window.clearQueue(); document.getElementById('stuck-banner').style.display='none'; }" style="margin-top:8px; margin-left:8px; padding:8px 12px; background:transparent; border:1px solid rgba(255,255,255,0.18); color:#fcd34d; border-radius:8px; font-size:12.5px; cursor:pointer;">Отменить</button>
  `;
}

function setOnlineState() {
  document.documentElement.classList.toggle('offline', !navigator.onLine);
  if (navigator.onLine) processQueue();
}
window.addEventListener('online', setOnlineState);
window.addEventListener('offline', setOnlineState);
// Агрессивный ретрай — каждые 5с пока есть pending
setInterval(() => { if (queue.length > 0 && navigator.onLine) processQueue(); }, 5000);
// Обновление баннера зависших каждые 15с
setInterval(() => updateStuckBanner(), 15000);

// При возврате PWA/вкладки на экран — пересинкаемся (realtime мог отвалиться в фоне)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && session) {
    setupRealtime();
    syncSoon();
  }
});

let realtimeWasOpen = false;
let realtimeRetries = 0;
function setupRealtime() {
  if (realtime) { try { sb.removeChannel(realtime); } catch {} }
  realtimeWasOpen = false;
  realtime = sb.channel('user-data-' + Date.now())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => syncSoon())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' },    () => syncSoon())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' },   () => syncSoon())
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { realtimeWasOpen = true; realtimeRetries = 0; return; }
      if (realtimeWasOpen && (status === 'CHANNEL_ERROR' || status === 'CLOSED' || status === 'TIMED_OUT')) {
        realtimeWasOpen = false;
        realtimeRetries++;
        // Exponential backoff: 5s, 15s, 45s, 2 min, 5 min (capped)
        const delay = Math.min(5000 * Math.pow(3, realtimeRetries - 1), 300000);
        console.warn('realtime dropped:', status, '→ reconnect in', delay / 1000, 's');
        setTimeout(() => { if (session) setupRealtime(); }, delay);
      }
    });
}

// Периодический пересинк раз в 2 минуты — страховка если realtime молча отвалился
setInterval(() => {
  if (session && !document.hidden && navigator.onLine) syncSoon();
}, 120_000);
function syncSoon() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    if (queue.length > 0) { syncSoon(); return; }
    if (!navigator.onLine) { syncSoon(); return; }
    // Защита от перезаписи оптимистичного state свежей мутацией
    const sinceMutation = Date.now() - lastMutationAt;
    if (sinceMutation < 5000) {
      setTimeout(syncSoon, 5000 - sinceMutation);
      return;
    }
    try { await loadAll(); saveCache(); } catch(e) { console.warn('syncSoon loadAll failed:', e); return; }
    if (currentTab === 'track')   renderGrid();
    if (currentTab === 'stats')   renderStats();
    if (currentTab === 'history') renderHistory();
  }, 300);
}

// Экспортируем state и helpers на window для отладки/тестов
window.state = state;
window.getCurrentTab = () => currentTab;
window.forceStopActive = forceStopActive;
window.toggleCategory = toggleCategory;
window.openEdit = openEdit;
window.openAddEntry = openAddEntry;
window.deleteEntry = deleteEntry;
window.syncSoon = syncSoon;
window.processQueue = processQueue;
window.getQueue = () => queue;
window.clearQueue = () => { queue.length = 0; saveQueue(); };
// Не оборачиваем — иначе window.X = () => X() даёт бесконечную рекурсию,
// потому что function declaration кладёт X на window и арроу вызывает сама себя.
// Прямое присваивание ссылки решает проблему.

/* ---------- Boot ---------- */
// Если есть кэш — показываем дашборд мгновенно, не дожидаясь сети
if (document.documentElement.classList.contains('authed')) {
  if (loadCache()) renderGrid();
  updateQueueBadge();
}
bootAuth();
tickInterval = setInterval(tick, 1000);
setInterval(() => {
  if (!session) return;
  if (currentTab === 'track') renderGrid();
  if (currentTab === 'stats') renderStats();
}, 60_000);
</script>
</body>
</html>
